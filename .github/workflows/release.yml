name: Release

# Ogni push su main -> prerelease rolling "latest" (asset sovrascritti).
# Ogni tag v* -> release stabile versionata.
# Il "version bump" e' automatico: build-release.sh esporta CROSSPILOT_BUILD_TS
# (unix ts) condiviso dai 3 artefatti; l'auto-update confronta il ts, non il
# semver, quindi non serve bumpare Cargo.toml ad ogni push.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build artifacts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Storia completa + tag: build.rs deriva la versione semver da
          # `git describe --match 'v[0-9]*'` (auto-incremento dopo il tag).
          fetch-depth: 0

      - name: Install Rust toolchain + cross targets
        uses: dtolnay/rust-toolchain@stable
        with:
          # windows-gnu = exe server remoto; musl = sidecar self-update
          targets: x86_64-pc-windows-gnu,x86_64-unknown-linux-musl

      - name: Install cross toolchain (MinGW per exe Windows, musl-gcc per sidecar)
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 musl-tools

      - name: Build release (exe Windows + sidecar musl + host con embeds)
        env:
          # ring (dipendenza di rustls) ha build.rs in C: cc-rs cerca
          # x86_64-linux-musl-gcc, musl-tools fornisce musl-gcc -> alias.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: ./scripts/build-release.sh

      - name: Resolve release tag
        id: rel
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            # Rolling prerelease: tag fisso 'latest', asset sovrascritti
            # ad ogni push su main. I client che puntano a 'latest'
            # ricevono sempre il build piu' recente.
            # Il nome include la versione da git describe (es. 1.0.0-6-gabc1234):
            # e' lo stesso valore che --version mostrera' nel binario.
            VER=$(git describe --tags --match 'v[0-9]*' --always 2>/dev/null | sed 's/^v//')
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "name=latest (rolling ${VER:-build ${GITHUB_SHA::7}})" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload linux client (gnu, embeds completi)
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/release/crosspilot
          # Nome canonico di prod: il client linux e' "crosspilot"
          asset_name: crosspilot
          tag: ${{ steps.rel.outputs.tag }}
          release_name: ${{ steps.rel.outputs.name }}
          prerelease: ${{ steps.rel.outputs.prerelease }}
          overwrite: true

      - name: Upload windows server exe (standalone, deploy manuale)
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: assets/crosspilot.exe
          # Nome canonico di prod: il server windows e' "crosspilot.exe"
          asset_name: crosspilot.exe
          tag: ${{ steps.rel.outputs.tag }}
          overwrite: true

      - name: "Upload linux musl statico (gira ovunque: Ubuntu/NixOS/Alpine)"
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: assets/crosspilot.linux
          # Nome canonico dell'artefatto sidecar: "crosspilot.linux"
          asset_name: crosspilot.linux
          tag: ${{ steps.rel.outputs.tag }}
          overwrite: true
