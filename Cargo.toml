[package]
name = "crosspilot"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
dotenvy = "0.15"
# Algoritmo rsync (rolling checksum + strong hash + delta) puro Rust, lineage Dropbox.
# Usato per il transfer delta stile rsync (vedi docs/transfer-spec.md).
fast_rsync = "0.2"
# SHA-256 whole-file: fast_rsync usa MD4 (insicuro) come strong hash per-blocco.
# SHA-256 sul file ricostruito garantisce integrità end-to-end (delta sbagliato -> mismatch -> ERR 4).
sha2 = "0.11"
# Client WinRM nativo (puro Rust, async, NTLMv2) per il bootstrap del server remoto.
# Sostituisce evil-winrm (shell Ruby interattiva) che non gestiva lo stdin piped
# in modo deterministico, causando il bug "server did not come up within 30s".
# Vedi bootstrap_server() in src/bootstrap.rs per i dettagli del bug.
winrm-rs = "1.2.2"

# Canale di bootstrap alternativo SMB/SCM per remote Windows senza WinRM
# (spec docs/smb-scm-bootstrap-spec.md): smb2-client = trasporto SMB2
# (NTLMv2, named pipe, file I/O su admin share), ms-scmr = esecuzione
# remota via Service Control Manager (pattern psexec validato su H166,
# bug.md §2). Entrambi puro Rust: niente FFI, compatibili col build
# musl statico e windows-gnu di build-release.sh.
smb2-client = "0.2.5"
ms-scmr = "0.1"

# TLS 1.3 post-quantum sul canale TCP client<->server (docs/tls-pq-spec.md §2).
# Provider "ring": gia' compilato su tutti i target (rustls entra via
# winrm-rs vendored e russh; workaround musl in AGENTS.md). aws-lc-rs
# ESCLUSO: cmake+NASM -> cross-compile windows-gnu noto-fallito upstream
# (issues #753/#835/#850) e musl static richiederebbe una toolchain extra.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# Key exchange ibrido X25519+ML-KEM-768 pure-Rust (FIPS 203, codepoint
# 0x11EC — lo stesso gruppo di Chrome/Cloudflare). Crate giovane ma la
# meta' PQ e' additive: X25519 conserva comunque la sicurezza classica.
rustls-pq-addon = "0.0.2"
# Cert self-signed del server generato a runtime (spec §7.1): nessun key
# material embeddato nel binario.
rcgen = "0.14"
# Decode dei PEM key/cert del server per ServerConfig (solo parsing, pure Rust).
rustls-pemfile = "2"
# Fingerprint "tls-sha256:<b64>" nel file crosspilot_known_hosts (spec §7.2).
base64 = "0.23"

# Canale SSH unificato (docs/ssh-unified-prescan-bootstrap-spec.md §1):
# russh = client SSH2 puro Rust async (niente binario `ssh` di sistema,
# niente FFI -> musl + windows-gnu ok); russh-sftp = sottosistema SFTP
# per le file ops indipendenti dalla shell remota (decisivo su Windows).
# default-features=false: i default attivano aws-lc-rs (cmake/C++, rischio
# cross-compile) e flate2; "ring" e' il backend crypto gia' compilato per
# musl via rustls, "rsa" serve per autenticare chiavi id_rsa esistenti.
russh = { version = "0.63.3", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3.0.0"

# Subcomando `sql` (query MySQL read-only, connessione diretta locale):
# mysql_async e' pure Rust async su tokio. default-features=false +
# default-rustls-ring seleziona il backend TLS rustls/ring (gia' compilato
# per musl+windows-gnu via rustls) + flate2/rust_backend (miniz_oxide,
# niente zlib C): nessuna dipendenza nativa, niente aws-lc-rs/native-tls.
# CAVEAT upstream: rustls non accetta IP come SNI — SSL=auto (default)
# usa TLS solo quando HOST e' un hostname DNS, non un IP (vedi sql.rs).
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }

[patch.crates-io]
# PATCH LOCALE: winrm-rs 1.2.2 ha un bug in create_shell_request (soap/envelope.rs):
# emette <wsman:OptionSet> FUORI da </s:Header>, producendo un envelope SOAP 1.2
# invalido. Il server WinRM rifiuta con HTTP 500 *dopo* l'auth NTLM riuscita.
# Fix applicata in vendor/winrm-rs: OptionSet inserito dentro <s:Header> via
# header.replace("</s:Header>", ...), come già fa create_psrp_shell_request.
# TODO: rimuovere quando upstream fixa (segnalare su github.com/muchiny/winrm-rs).
winrm-rs = { path = "vendor/winrm-rs" }

# PATCH LOCALE: smb2-client 0.2.5 espone la WRITE solo su named pipe, non su
# file disco — l'upload degli artefatti su C$ (deploy staged SMB/SCM)
# richiede CREATE+WRITE+CLOSE su share admin. Aggiunti
# SmbClient::write_file / delete_file in vendor/smb2-client/src/client.rs.
# Il patch si applica anche alla dipendenza transitiva di ms-scmr
# (ms-scmr -> smb2-client ^0.2 usa lo stesso sorgente vendored).
# TODO: proporre upstream (github.com/icedracon/smb2-client).
smb2-client = { path = "vendor/smb2-client" }

# PATCH LOCALE: rustls-pq-addon 0.0.2 dipende da ml-kem ^0.2.3 (kem
# =0.3.0-pre.0), incompatibile con ml-kem ^0.3 richiesto da russh 0.63.3
# (kem ^0.3): le due versioni di `kem` non risolvono insieme. Il crate
# vendored porta i suoi ~1000 LoC a ml-kem 0.3 (EncapsulationKey/
# DecapsulationKey top-level, trait kem::{Kem,Encapsulate,Decapsulate},
# rand_core 0.10 accanto a rand_core 0.6 per x25519-dalek).
# TODO: rimuovere quando upstream pubblica la versione su ml-kem 0.3.
rustls-pq-addon = { path = "vendor/rustls-pq-addon" }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["jobapi2", "processthreadsapi", "winnt", "handleapi", "synchapi", "fileapi", "winbase"] }

[dev-dependencies]
# Solo per examples/winrm_test.rs: debug tracing del handshake WinRM/NTLM.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
# Strip simboli debug: riduce drasticamente la dimensione del binario
# (specialmente l'exe Windows cross-compilato, che altrimenti include
# ~130MB di debug info). Necessario per l'embed via include_bytes!.
strip = true
# LTO per ridurre ulteriormente la dimensione.
lto = true
# Single codegen unit per ottimizzazioni migliori.
codegen-units = 1
# Ottimizza per size (l'exe Windows viene embeddato nel binario Linux).
opt-level = "z"
